<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="icon-512.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-512.png">
    <title>中华传统色 | PureColor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* 调整主容器布局 */
        .container {
            max-width: min(1200px, calc(100vw - 180px));
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
            margin-top: 20px;
        }

        /* Fixed Back Button */
        .back-btn-fixed {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-soft);
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-btn-fixed:hover {
            transform: translateX(-2px);
            box-shadow: var(--shadow-hover);
            background: var(--surface-hover);
        }

        .back-btn-fixed svg {
            flex-shrink: 0;
        }

        /* 
         * --- Modern Chinese Aesthetic Redesign --- 
         * Theme: Ink & Scroll (水墨与卷轴)
         */

        /* 颜色列表容器 */
        .traditional-colors-list {
            display: flex;
            flex-direction: column;
            gap: 60px;
            /* More breathing room */
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 节气标题样式优化 */
        .season-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 28px;
            font-weight: 600;
            color: var(--text-main);
            margin: 40px 0 24px;
            text-align: center;
            position: relative;
            scroll-margin-top: 40px;
            letter-spacing: 2px;
        }

        /* Ink stroke decoration under title */
        .season-title::after {
            content: '';
            display: block;
            width: 40px;
            height: 3px;
            background: var(--text-muted);
            margin: 10px auto 0;
            opacity: 0.3;
            border-radius: 2px;
        }

        /* 颜色网格布局优化 - Compact Grid with varying delays for animation */
        .season-colors {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 20px;
            width: 100%;
            margin: 0 auto;
        }

        /* 颜色卡片样式优化 - Floating Card */
        .color-card {
            background: transparent;
            border: none;
            padding: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            /* Elastic bounce */
            height: auto;
            align-items: center;
            opacity: 0;
            /* Hidden initially for animation */
            animation: slideUpFade 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        /* Staggered animation delays for the first 10 items to create a wave */
        .color-card:nth-child(1) {
            animation-delay: 0.05s;
        }

        .color-card:nth-child(2) {
            animation-delay: 0.1s;
        }

        .color-card:nth-child(3) {
            animation-delay: 0.15s;
        }

        .color-card:nth-child(4) {
            animation-delay: 0.2s;
        }

        .color-card:nth-child(5) {
            animation-delay: 0.25s;
        }

        .color-card:nth-child(6) {
            animation-delay: 0.3s;
        }

        .color-card:nth-child(n+7) {
            animation-delay: 0.35s;
        }

        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .color-card:hover {
            transform: translateY(-8px) scale(1.05);
            z-index: 10;
        }

        /* The Color "Ink Block" */
        .color-preview {
            width: 100%;
            aspect-ratio: 2/3;
            /* Balanced Traditional Card Ratio */
            border-radius: 6px;
            margin-bottom: 0;
            transition: all 0.5s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }



        /* Shine effect on hover */
        .color-preview::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0) 50%);
            opacity: 0.6;
            pointer-events: none;
        }

        .color-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
            text-align: center;
            width: 100%;
        }

        .color-name {
            font-family: 'Noto Serif SC', serif;
            font-size: 16px;
            /* Smaller font */
            font-weight: 500;
            color: var(--text-main);
            letter-spacing: 1px;
            writing-mode: vertical-rl;
            /* Vertical text for authentic scroll look */
            text-orientation: upright;
            height: 120px;
            /* Fixed height for name column */
            margin-top: 4px;
        }

        .color-pinyin {
            display: none;
            /* Hide pinyin for cleaner look, or move to tooltip */
        }

        /* Description is hidden by default in grid to keep it clean, could appear on detail view or modal */
        .color-desc {
            display: none;
        }

        .color-actions {
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: row;
            /* Horizontal alignment */
            align-items: center;
            justify-content: center;
            gap: 8px;
            /* Small gap between hex and button */
            margin-top: 8px;
            /* Space from vertical text */
            width: 100%;
        }

        .color-card:hover .color-actions {
            opacity: 1;
            transform: translateY(0);
        }

        /* Subtle minimalist buttons */
        .download-btn {
            background: transparent;
            border: none;
            width: 20px;
            height: 20px;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            opacity: 0.7;
        }

        /* Copy action is now implicitly the card click, download is explicit */

        .download-btn:hover {
            background: var(--surface-hover);
            color: var(--primary);
            border-color: var(--primary);
            transform: scale(1.1);
        }

        .download-btn svg {
            width: 14px;
            height: 14px;
        }

        .color-hex {
            font-family: 'Inter', monospace;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 400;
            opacity: 0.6;
            margin-top: 4px;
            display: block;
        }

        /* 导航栏样式 */
        .seasons-nav {
            position: fixed;
            top: 100px;
            right: 20px;
            z-index: 100;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
            max-height: calc(100vh - 120px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            width: 100px;
        }

        .nav-scroll {
            overflow-y: auto;
            padding: 10px;
            scrollbar-width: thin;
            scrollbar-color: var(--glass-border) transparent;
        }

        .nav-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .nav-scroll::-webkit-scrollbar-thumb {
            background-color: var(--glass-border);
            border-radius: 4px;
        }

        .nav-item {
            padding: 12px 0;
            /* Vertical breathing */
            margin: 0;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 14px;
            transition: all 0.3s ease;
            white-space: nowrap;
            font-family: 'Noto Serif SC', serif;
            /* Use serif for nav too */
            text-align: center;
            border-right: 2px solid transparent;
            border-radius: 0;
            /* No radius, use border indicator */
        }

        .nav-item:hover {
            color: var(--text-main);
            background: linear-gradient(90deg, transparent, rgba(0, 0, 0, 0.02));
        }

        .nav-item.active {
            background: transparent;
            color: var(--text-main);
            font-weight: 600;
            position: relative;
        }

        /* 响应式布局优化 */
        @media (min-width: 1400px) {
            .season-colors {
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                max-width: 1200px;
            }
        }

        @media (min-width: 1024px) and (max-width: 1399px) {
            .season-colors {
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                max-width: 1000px;
            }
        }

        @media (min-width: 768px) and (max-width: 1023px) {
            .season-colors {
                grid-template-columns: repeat(2, 1fr);
                max-width: 800px;
            }

            .container {
                margin-right: 140px;
            }
        }

        @media (max-width: 767px) {
            .container {
                margin: 40px auto 70px auto;
                padding: 10px;
                max-width: 100%;
            }

            .back-btn-fixed {
                top: 10px;
                left: 10px;
                padding: 0.6rem 1rem;
                font-size: 0.9rem;
            }

            .back-btn-fixed span {
                display: none;
            }

            .season-colors {
                /* Mobile: 3 columns for denser view with tall cards */
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }


            .seasons-nav {
                top: auto;
                bottom: 0;
                left: 0;
                right: 0;
                width: 100%;
                max-height: 60px;
                border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            }

            .nav-scroll {
                display: flex;
                overflow-x: auto;
                padding: 10px;
                gap: 10px;
                scroll-behavior: smooth;
                -webkit-overflow-scrolling: touch;
            }

            .nav-item {
                flex: 0 0 auto;
            }
        }

        /* 超小屏幕适配 */
        @media (max-width: 480px) {
            .season-colors {
                gap: 10px;
            }

            .color-card {
                padding: 10px;
            }

            .color-name {
                font-size: 16px;
            }

            .color-desc {
                font-size: 13px;
            }
        }

        .container h1 {
            margin: clamp(30px, 5vh, 50px) 0;
            color: var(--text-main);
            font-size: clamp(24px, 3vw, 32px);
            text-align: center;
            font-weight: 700;
        }

        /* Fixed Header Styles */
        .page-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
        }

        .back-btn {
            position: absolute;
            left: 20px;
            background: transparent;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .header-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
            margin: 0;
            letter-spacing: 2px;
        }

        /* Adjust container to account for fixed header */
        .container {
            margin-top: 80px !important;
            /* Override other margins */
            padding-top: 20px;
        }

        /* Remove old back button styles if necessary, or just override */
        .back-btn-fixed {
            display: none;
        }
    </style>
</head>

<body>
    <!-- Fixed Header -->
    <header class="page-header">
        <button class="back-btn" onclick="window.location.href='index.html'">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
            </svg>
        </button>
        <h1 class="header-title">中华传统色</h1>
    </header>

    <!-- Season Navigation -->
    <div class="seasons-nav">
        <div class="nav-scroll">
            <!-- 导航内容将由 JS 动态生成 -->
        </div>
    </div>
    <div class="container">
        <div class="traditional-colors-list" id="traditionalColorsList">
            <!-- 颜色卡片将通过 JavaScript 动态添加 -->
        </div>
    </div>
    <script src="traditional-colors.js"></script>
</body>

</html>
