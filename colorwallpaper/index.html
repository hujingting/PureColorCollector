<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure Color Collector</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">

        <!-- Header -->
        <header class="app-header glass-card">
            <div class="brand-logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z" />
                </svg>
                PureColor
            </div>

            <div class="header-right">
                <button id="themeToggleBtn" class="nav-btn icon-only" title="切换日/夜模式">
                    <!-- Sun Icon (Default shown in dark mode) -->
                    <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"
                        style="display: none;">
                        <path
                            d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z" />
                    </svg>
                    <!-- Moon Icon (Default shown in light mode) -->
                    <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z" />
                    </svg>
                </button>
                <button id="menuToggleBtn" class="nav-btn icon-only" title="菜单">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- Dropdown Menu -->
        <nav id="dropdownMenu" class="dropdown-menu glass-card">
            <button id="traditionalColorsBtn" class="menu-item"
                onclick="window.location.href='traditional-colors.html'">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.5" />
                    <path d="M12 2 A10 10 0 0 1 12 22 A5 5 0 0 1 12 12 A5 5 0 0 0 12 2" fill="currentColor" />
                    <circle cx="12" cy="7" r="1.5" fill="var(--surface)" />
                    <circle cx="12" cy="17" r="1.5" fill="currentColor" />
                </svg>
                中华传统色
            </button>
            <button id="birthdayColorsBtn" class="menu-item" onclick="window.location.href='birthday-colors.html'">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V9h14v10zM7 11h2v2H7v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2z" />
                </svg>
                生日色
            </button>
        </nav>

        <!-- Hero Actions -->
        <section class="hero-upload glass-card">
            <h1>从图片中探索色彩</h1>
            <p style="color: var(--text-muted);">上传图片提取配色方案，生成专属纯色或渐变壁纸</p>

            <input type="file" id="imageInput" accept="image/*" hidden>
            <button id="uploadButton" class="upload-btn animate-pulse">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                </svg>
                选择图片开始
            </button>
        </section>

        <!-- Main Workspace (Hidden by default) -->
        <main id="preview-container" class="content-grid" style="display: none;">

            <!-- Left: Image Preview -->
            <div class="image-preview-card glass-card">
                <img id="previewImage" src="" alt="预览图片">
            </div>

            <!-- Right: Tools Panel -->
            <div class="colors-panel glass-card">

                <div class="panel-header">
                    <span class="panel-title">提取结果</span>
                    <button id="gradientButton" class="action-btn" style="padding: 0.4rem; font-size: 0.8rem;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z" />
                        </svg>
                        应用渐变
                    </button>
                </div>

                <div class="colors-list">
                    <!-- Dynamic Items -->
                </div>

                <div class="actions-area">
                    <button id="saveGradientBtn" class="action-btn btn-primary" style="display: none;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" />
                        </svg>
                        保存渐变壁纸
                    </button>

                    <div style="height: 1px; background: rgba(0,0,0,0.1); margin: 0.5rem 0;"></div>

                    <div class="custom-color-wrapper">
                        <div id="customColorPreview" class="preview-dot" style="background: #fff;"></div>
                        <input type="text" id="customColorInput" placeholder="#FFFFFF" maxlength="7">
                    </div>

                    <button id="saveCustomColorBtn" class="action-btn" disabled>
                        保存自定义颜色
                    </button>
                </div>
            </div>

        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
