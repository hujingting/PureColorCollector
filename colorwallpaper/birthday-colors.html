<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日色 - PureColorCollector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* 调整主容器布局 */
        .container {
            max-width: min(1200px, calc(100vw - 180px));
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
            margin-top: 20px;
        }

        /* Fixed Back Button */
        .back-btn-fixed {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-soft);
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-btn-fixed:hover {
            transform: translateX(-2px);
            box-shadow: var(--shadow-hover);
            background: var(--surface-hover);
        }

        .back-btn-fixed svg {
            flex-shrink: 0;
        }

        /* 颜色列表容器 */
        .birthday-colors-list {
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 月份标题样式 */
        .month-title {
            font-size: clamp(20px, 2vw, 24px);
            font-weight: bold;
            color: var(--text-main);
            margin: 20px 0 15px;
            padding-left: 15px;
            border-left: 4px solid var(--primary);
            position: relative;
        }

        /* 颜色网格布局 */
        .birthday-colors-grid {
            display: grid;
            gap: clamp(15px, 2vw, 20px);
            width: 100%;
            margin: 0 auto;
        }

        /* 颜色卡片样式 */
        .bday-color-card {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: clamp(12px, 1.5vw, 15px);
            box-shadow: var(--shadow-soft);
            display: flex;
            flex-direction: column;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            height: 100%;
        }

        .bday-color-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .bday-color-preview {
            height: clamp(120px, 15vw, 140px);
            border-radius: var(--radius-sm);
            margin-bottom: 10px;
            transition: transform 0.2s ease;
        }

        .bday-color-card:hover .bday-color-preview {
            transform: scale(1.02);
        }

        .bday-color-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .bday-date {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
        }

        .bday-color-name {
            font-size: 14px;
            color: var(--text-muted);
            font-style: italic;
        }

        .color-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
            padding-top: 8px;
            border-top: 1px solid var(--glass-border);
        }

        .download-btn {
            background: transparent;
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            padding: 6px 12px;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background: var(--surface-hover);
            color: var(--primary);
            border-color: var(--primary);
        }

        .download-btn svg {
            width: 14px;
            height: 14px;
        }

        .bday-color-hex {
            font-family: 'Inter', monospace;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
        }

        /* 导航栏样式 */
        .months-nav {
            position: fixed;
            top: 100px;
            right: 20px;
            z-index: 100;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
            max-height: calc(100vh - 120px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            width: 100px;
        }

        .nav-scroll {
            overflow-y: auto;
            padding: 10px;
            scrollbar-width: thin;
            scrollbar-color: var(--glass-border) transparent;
        }

        .nav-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .nav-scroll::-webkit-scrollbar-thumb {
            background-color: var(--glass-border);
            border-radius: 4px;
        }

        .nav-item {
            padding: 8px 16px;
            margin: 4px 0;
            cursor: pointer;
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            font-size: 14px;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .nav-item:hover {
            background: var(--surface-hover);
            color: var(--text-main);
        }

        .nav-item.active {
            background: var(--primary);
            color: white;
        }

        /* 响应式布局 */
        @media (min-width: 1400px) {
            .birthday-colors-grid {
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                max-width: 1200px;
            }
        }

        @media (min-width: 1024px) and (max-width: 1399px) {
            .birthday-colors-grid {
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                max-width: 1000px;
            }
        }

        @media (min-width: 768px) and (max-width: 1023px) {
            .birthday-colors-grid {
                grid-template-columns: repeat(2, 1fr);
                max-width: 800px;
            }

            .container {
                margin-right: 140px;
            }
        }

        @media (max-width: 767px) {
            .container {
                margin: 80px auto 70px auto;
                padding: 15px;
                max-width: 100%;
            }

            .back-btn-fixed {
                top: 10px;
                left: 10px;
                padding: 0.6rem 1rem;
                font-size: 0.9rem;
            }

            .back-btn-fixed span {
                display: none;
            }

            .months-nav {
                top: auto;
                bottom: 0;
                left: 0;
                right: 0;
                width: 100%;
                max-height: 60px;
                border-radius: var(--radius-lg) var(--radius-lg) 0 0;
                background: var(--bg-container);
                backdrop-filter: blur(10px);
            }

            .nav-scroll {
                display: flex;
                overflow-x: auto;
                padding: 10px;
                gap: 10px;
                scroll-behavior: smooth;
                -webkit-overflow-scrolling: touch;
            }

            .nav-item {
                flex: 0 0 auto;
            }

            .birthday-colors-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
        }

        /* 添加返回按钮样式 */
        .back-btn {
            position: fixed;
            top: clamp(15px, 2vh, 20px);
            left: clamp(15px, 2vw, 20px);
            padding: 10px 20px;
            background: var(--bg-container);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px var(--shadow-color);
            color: var(--text-primary);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .back-btn:hover {
            transform: translateX(-2px);
            box-shadow: 0 4px 12px var(--shadow-color);
        }

        .container h1 {
            margin: clamp(30px, 5vh, 50px) 0;
            color: var(--text-main);
            font-size: clamp(24px, 3vw, 32px);
            text-align: center;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <!-- Back Button -->
    <button class="back-btn-fixed" onclick="window.location.href='index.html'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
        </svg>
        <span>返回</span>
    </button>

    <!-- Month Navigation -->
    <div class="months-nav">
        <div class="nav-scroll">
            <!-- 导航内容将由 JS 动态生成 -->
        </div>
    </div>
    <div class="container">
        <h1>生日色</h1>
        <div class="birthday-colors-list" id="birthdayColorsContainer">
            <!-- 颜色卡片将通过 JavaScript 动态添加 -->
        </div>
    </div>
    <script src="birthday-colors.js"></script>
</body>

</html>
